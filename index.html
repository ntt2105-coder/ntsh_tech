<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>投高技職3D導覽</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-bleed 3D stage; labels float over buildings; info panel docks right (desktop) or bottom (phone); department chips run along the bottom edge. */
:root{
  --hl:#e11d48;
  --bg:#eef3f0; --fg:#14211f; --muted:#51615e; --line:#c7d3cf;
  --panel:rgba(255,255,255,.93); --chip:#ffffff; --accent:#0f766e; --accent-fg:#ffffff;
  --sky-top:#bfe0ee; --sky-bot:#eef4e8; --ground:#dfe8da; --path:#c6cfc2; --shadow:rgba(20,33,31,.18);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --fg:#e6efed; --muted:#9db2ad; --line:#2a3b38;
  --panel:rgba(16,26,25,.93); --chip:#152321; --accent:#5eead4; --accent-fg:#06201c;
  --sky-top:#0a1822; --sky-bot:#26403f; --ground:#1c2a28; --path:#2b3d3a; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --fg:#e6efed; --muted:#9db2ad; --line:#2a3b38;
  --panel:rgba(16,26,25,.93); --chip:#152321; --accent:#5eead4; --accent-fg:#06201c;
  --sky-top:#0a1822; --sky-bot:#26403f; --ground:#1c2a28; --path:#2b3d3a; --shadow:rgba(0,0,0,.5); color-scheme:dark}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl:#fb7185}}
:root[data-theme="dark"]{--hl:#fb7185}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:14px; line-height:1.6;
  padding-block:0; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#stage{position:fixed;inset:0;background:linear-gradient(var(--sky-top),var(--sky-bot));overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.label{
  position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;white-space:nowrap;
  padding:4px 10px 4px 8px;border-radius:999px;background:var(--chip);color:var(--fg);border:1px solid var(--line);
  font-size:12.5px;font-weight:500;box-shadow:0 2px 8px var(--shadow);transform:translate(-50%,-100%);will-change:transform;
}
.label i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.label.on{font-weight:700;border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 4px 12px var(--shadow)}
.label.hov{border-color:var(--c)}
.hub{
  position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);text-align:center;
  font-weight:900;font-size:13px;letter-spacing:.18em;color:var(--fg);text-shadow:0 1px 0 var(--chip),0 0 8px var(--chip);white-space:nowrap
}

.ui{position:relative;height:100%;pointer-events:none}
.ui>*{pointer-events:auto}
header{position:absolute;left:0;top:14px;max-width:calc(100% - 150px)}
header{display:flex;align-items:center;gap:10px}
.logo{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 2px 8px var(--shadow)}
header h1{margin:0;font-size:22px;line-height:1.15;font-weight:900;letter-spacing:.02em}
header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tools{position:absolute;right:0;top:14px;display:flex;gap:8px}
.btn{
  border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500;
}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}

.panel{
  position:absolute;right:0;top:78px;bottom:78px;width:min(372px,100%);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 10px 30px var(--shadow);overflow:hidden;
}
.panel-head{display:flex;gap:10px;align-items:flex-start;padding:16px 16px 10px;border-top:5px solid var(--c,var(--accent))}
.panel-head .tt{flex:1;min-width:0}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--c,var(--accent));margin:0}
.panel h2{margin:2px 0 0;font-size:22px;line-height:1.25;font-weight:900;text-wrap:balance}
#fold{display:none;border:1px solid var(--line);background:transparent;border-radius:8px;width:32px;height:32px;line-height:1}
.panel-body{padding:2px 16px 16px;overflow:auto;min-height:0;flex:1}
.stat{display:flex;align-items:baseline;gap:8px;margin:6px 0 12px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent)}
.stat b{font-family:var(--font-num);font-size:26px;line-height:1;font-weight:700;color:var(--c,var(--accent));font-variant-numeric:tabular-nums}
.stat b small{color:var(--fg);font-size:13px;font-weight:700;margin-left:3px;font-family:var(--font-body)}
.stat span{font-size:12.5px;color:var(--fg);font-weight:500}
.panel ul{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.panel li{position:relative;padding-left:16px;font-size:13.5px}
.panel li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--c,var(--accent))}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.links a{
  text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--fg);background:var(--chip)
}
.links a:hover{border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.step{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.step button{flex:1;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:500;text-align:left;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step button:hover{border-color:var(--accent)}
.step button:last-child{text-align:right}
.meta{font-size:12px;color:var(--muted);margin:0;line-height:1.7}
.hint{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 12px}
.hint b{color:var(--fg);font-weight:700}
.names{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:500}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pill:hover{border-color:var(--c)}
.nm{all:unset;cursor:pointer}
.nm:hover,.nm:focus-visible{text-decoration:underline;text-underline-offset:3px}
.slogan{margin:0 0 6px;font-size:15px;font-weight:900;line-height:1.6}
.slogan2{margin:0 0 14px;font-size:14.5px;font-weight:700;color:var(--accent);text-wrap:balance}
.panel.collapsed .panel-body{display:none}

.chips{
  position:absolute;left:0;right:0;bottom:14px;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;
}
.chip{
  flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--chip);border-radius:999px;
  padding:7px 14px 7px 11px;font-size:13px;font-weight:500;box-shadow:0 2px 8px var(--shadow);white-space:nowrap;
}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent))}
.chip[aria-current="true"]{background:var(--c,var(--accent));color:#fff;border-color:transparent;font-weight:700}
.chip[aria-current="true"] i{background:#fff}
.chip.home[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
.chip.home[aria-current="true"] i{background:var(--accent-fg)}

#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}

@media (max-width:820px){
  header h1{font-size:18px}
  header p{display:none}
  .panel{top:auto;left:0;right:0;width:100%;bottom:66px;max-height:44%}
  #fold{display:block}
  .panel h2{font-size:19px}
  .label{font-size:11.5px;padding:3px 8px 3px 6px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

  <div id="labels"></div>

    var b=makeStudent(); b.group.position.set(sgn*2.35,0,3.5); b.group.rotation.y=sgn*0.55; g.add(b.group);
    var off=i*1.7;
    anims.push(function(t){
      a.armR.rotation.z=2.55+Math.sin(t*5+off)*0.4; a.body.position.y=Math.abs(Math.sin(t*2.5+off))*0.06;
      b.armL.rotation.x=-0.9+Math.sin(t*3+off)*0.35; b.armR.rotation.x=-0.3+Math.sin(t*2+off)*0.2; b.body.position.y=Math.abs(Math.sin(t*1.8+off))*0.03;
    });
  }
  var TCOATS=["#334155","#7c4a2d","#2f5d50","#4b3b6b","#6b2d3a","#1e3a5f","#475569"];
  function addTeaching(g,i,d){
    var sgn=i%2?1:-1, cx=-sgn*3.05, cz=3.55, off=i*1.3, ty=0.84;
    /* whiteboard behind the group */
    [-0.65,0.65].forEach(function(dx){add(g,B(0.06,1.0,0.06),cm("#8b8f96"),cx+dx,0.5,cz-0.95);});
    add(g,B(1.6,0.85,0.06),cm("#f8fafc"),cx,1.25,cz-0.95);
    add(g,B(1.6,0.12,0.07),cm(d.color),cx,1.58,cz-0.95);
    [0.3,0.1,-0.1].forEach(function(y,k){add(g,B(0.9-k*0.2,0.04,0.02),cm("#94a3b8"),cx-0.1,1.28+y*0.8,cz-0.91);});
    /* table with a small subject model */
    add(g,B(1.5,0.08,0.62),cm("#b08968"),cx+0.1,0.8,cz+0.95);
    [[-0.65,-0.25],[0.65,-0.25],[-0.65,0.25],[0.65,0.25]].forEach(function(p){add(g,B(0.06,0.76,0.06),cm("#6b4f3a"),cx+0.1+p[0],0.38,cz+0.95+p[1]);});
    var mx=cx+0.1, mz=cz+0.95;
    if(d.id==="arch"){ add(g,B(0.5,0.3,0.42),cm("#eadfc8"),mx,ty+0.15,mz); var rf=add(g,new T.ConeGeometry(0.42,0.3,4),cm(d.color),mx,ty+0.45,mz); rf.rotation.y=Math.PI/4; }
    else if(d.id==="art"){ add(g,Cyl(0.3,0.3,0.04,18),cm("#f8fafc"),mx,ty+0.03,mz); ["#00b7ff","#ff2e93","#ffd400"].forEach(function(c,k){add(g,Cyl(0.06,0.06,0.05,10),cm(c),mx-0.12+k*0.12,ty+0.07,mz+(k%2?0.08:-0.06));}); }
    else if(d.id==="cmd"){ var gr=add(g,Cyl(0.24,0.24,0.1,16),mat("#8d99a6",{metalness:0.5}),mx,ty+0.07,mz); for(var k=0;k<8;k++){var a=k/8*Math.PI*2; var tt=add(gr,B(0.1,0.1,0.1),mat("#8d99a6",{metalness:0.5}),Math.cos(a)*0.27,0,Math.sin(a)*0.27); tt.rotation.y=-a;} anims.push(function(t){gr.rotation.y=t*0.8;}); }
    else if(d.id==="electronic"){ add(g,B(0.7,0.04,0.5),cm("#15803d"),mx,ty+0.03,mz); add(g,B(0.22,0.07,0.22),cm("#1f2937"),mx,ty+0.08,mz); var lm=glow("#f87171",1.1); add(g,new T.SphereGeometry(0.05,10,10),lm,mx+0.25,ty+0.08,mz+0.15); anims.push(function(t){lm.emissiveIntensity=0.3+0.9*Math.max(0,Math.sin(t*4+off));}); }
    else if(d.id==="electric"){ add(g,B(0.34,0.14,0.34),cm("#f2b705"),mx,ty+0.08,mz); var pv=new T.Group(); pv.position.set(mx,ty+0.15,mz); g.add(pv); add(pv,B(0.07,0.4,0.07),cm("#e5e7eb"),0,0.2,0); anims.push(function(t){pv.rotation.z=Math.sin(t*1.2+off)*0.6;}); }
    else if(d.id==="commerce"){ add(g,B(0.34,0.26,0.34),cm("#c49a6c"),mx-0.2,ty+0.13,mz); add(g,B(0.3,0.22,0.3),cm("#f97316"),mx+0.2,ty+0.11,mz); add(g,B(0.24,0.2,0.24),cm(d.color),mx,ty+0.36,mz); }
    else { var gb=add(g,new T.SphereGeometry(0.22,16,12),mat("#2f6fbf"),mx,ty+0.3,mz); add(g,Cyl(0.05,0.1,0.1,10),cm("#5b6b82"),mx,ty+0.05,mz); anims.push(function(t){gb.rotation.y=t*0.7;}); }
    /* teacher + two students */
    var tc=makeStudent({teacher:true,shirt:TCOATS[i%TCOATS.length],pants:"#1f2937",scale:1.25});
    tc.group.position.set(cx-0.7,0,cz); g.add(tc.group);
    var s1=makeStudent(), s2=makeStudent();
    s1.group.position.set(cx+0.1,0,cz+0.05); s2.group.position.set(cx+0.75,0,cz-0.05); g.add(s1.group); g.add(s2.group);
    anims.push(function(t){
      tc.group.rotation.y=Math.sin(t*0.6+off)*0.3;
      tc.armR.rotation.x=-1.15+Math.sin(t*1.6+off)*0.28;
      tc.armL.rotation.x=-0.2+Math.sin(t*0.9+off)*0.12;
      tc.body.position.y=Math.abs(Math.sin(t*1.1+off))*0.02;
      s1.body.position.y=Math.abs(Math.sin(t*1.6+off))*0.03; s2.body.position.y=Math.abs(Math.sin(t*1.3+off+1))*0.03;
      s1.armL.rotation.z=-Math.max(0,Math.sin(t*0.7+off))*2.5;
      s2.armR.rotation.x=-0.4+Math.sin(t*2.2+off)*0.3;
    });
  }
  function addPathWalker(a,lane,phase,speed){
    var s=makeStudent(); scene.add(s.group);
    var lo=3.9, hi=R-3.7, len=hi-lo, p=phase*len*2, last=0, sx=Math.sin(a), sz=Math.cos(a);
    anims.push(function(t){
      var dt=Math.min(0.1,t-last); last=t; p=(p+dt*speed)%(len*2);
      var out=p<len, d=lo+(out?p:2*len-p);
      s.group.position.set(sx*d+Math.cos(a)*lane,0,sz*d-Math.sin(a)*lane);
      s.group.rotation.y=out?a:a+Math.PI;
      walkPose(s,t*speed*4.2+phase*9,0.7);
    });
  }
  function addHubWalker(r,phi0,dir,speed){
    var s=makeStudent(); scene.add(s.group);
    anims.push(function(t){
      var phi=phi0+dir*t*speed/r;
      s.group.position.set(Math.sin(phi)*r,0,Math.cos(phi)*r);
      s.group.rotation.y=phi+dir*Math.PI/2;
      walkPose(s,t*speed*4.2+phi0*5,0.7);
    });
  }
  DEPTS.forEach(function(d,i){
    var a=i/DEPTS.length*Math.PI*2;
    addPathWalker(a,0.38,(i*0.37)%1,1.1);
    addPathWalker(a,-0.38,(i*0.53+0.5)%1,0.95);
  });
  [[4.7,0,1],[4.7,2.1,1],[4.7,4.2,1],[5.5,1,-1],[5.5,3.1,-1],[5.5,5.2,-1]].forEach(function(c){addHubWalker(c[0],c[1],c[2],1.0);});

  var ring=new T.Mesh(new T.RingGeometry(4.0,4.35,64),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95,side:T.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.06; ring.visible=false; scene.add(ring);

  DEPTS.forEach(function(d,i){
    var a=i/DEPTS.length*Math.PI*2;
    var g=new T.Group(); g.position.set(Math.sin(a)*R,0,Math.cos(a)*R); g.rotation.y=a; g.userData.id=d.id; scene.add(g);
    var pad=new T.Mesh(new T.CircleGeometry(3.9,40),new T.MeshBasicMaterial({color:d.color,transparent:true,opacity:0.22})); pad.rotation.x=-Math.PI/2; pad.position.set(Math.sin(a)*R,0.03,Math.cos(a)*R); scene.add(pad);
    var len=R-6.4, mid=2.9+len/2;
    var path=new T.Mesh(B(1.3,0.05,len),pathMat); path.position.set(Math.sin(a)*mid,0.03,Math.cos(a)*mid); path.rotation.y=a; path.receiveShadow=true; scene.add(path);
    var top=build[d.id](g,d.color); addActivity(g,i); addTeaching(g,i,d);
    var item={id:d.id,group:g,color:new T.Color(d.color),a:a,top:top,label:null,s:1};
    groups.push(item);
    g.traverse(function(o){if(o.isMesh) pickables.push(o);});
  });

  /* central monument: seven colored discs, one per department */
  var hub=new T.Group(); scene.add(hub);
  add(hub,Cyl(2.9,3.1,0.3,48),mat("#d5dad2"),0,0.15,0);
  add(hub,Cyl(0.45,0.5,0.4,24),mat("#667"),0,0.5,0);
  DEPTS.forEach(function(d,i){add(hub,Cyl(1.5-i*0.1,1.5-i*0.1,0.3,40),mat(d.color,{roughness:0.5}),0,0.85+i*0.36,0);});
  var orb=add(hub,new T.SphereGeometry(0.5,24,20),glow("#ffffff",0.6),0,0.85+7*0.36+0.45,0);
  anims.push(function(t){orb.position.y=0.85+7*0.36+0.5+Math.sin(t*1.5)*0.08;});
  var hubTop=7.6;
  var logoImg=new Image();
  logoImg.onload=function(){
    var tex=new T.Texture(logoImg); tex.encoding=T.sRGBEncoding; tex.needsUpdate=true;
    var sp=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true,fog:false}));
    sp.scale.set(2.8,2.8,1); sp.position.set(0,6.1,0); scene.add(sp);
  };
  logoImg.src=LOGO;

  /* trees */
  var seed=7; function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  var trunkM=mat("#7a5a3a"), leafM=[mat("#4f8f5a"),mat("#3f7d52"),mat("#6aa05f")];
  for(var k=0;k<46;k++){
    var ang=rnd()*Math.PI*2, rad=24+rnd()*18, tx=Math.sin(ang)*rad, tz=Math.cos(ang)*rad, s=0.8+rnd()*0.9;
    var tr=new T.Group(); tr.position.set(tx,0,tz); tr.scale.setScalar(s); scene.add(tr);
    var t1=add(tr,Cyl(0.14,0.2,1,8),trunkM,0,0.5,0); t1.castShadow=false;
    var c1=add(tr,new T.ConeGeometry(1.0,2.1,8),leafM[k%3],0,1.9,0); c1.castShadow=false;
    var c2=add(tr,new T.ConeGeometry(0.75,1.6,8),leafM[(k+1)%3],0,2.8,0); c2.castShadow=false;
  }

  /* labels */
  groups.forEach(function(it){
    var d=BYID[it.id], el=document.createElement("button"); el.type="button"; el.className="label"; el.style.setProperty("--c",d.color);
    el.innerHTML="<i></i>"+esc(d.name); el.addEventListener("click",function(){select(d.id);}); labelsEl.appendChild(el); it.label=el;
  });
  var hubLabel=document.createElement("div"); hubLabel.className="hub"; hubLabel.textContent="技職首選　南投高中"; labelsEl.appendChild(hubLabel);

  /* ---- camera rig ---- */
  var view={theta:0.55,phi:1.0,radius:60,off:0,tx:0,ty:0,tz:0};
  var goal={theta:0.55,phi:1.0,radius:38,off:0,tx:0,ty:1.5,tz:0};
  var MINR=8,MAXR=62, auto=true, interacting=false, W=1,H=1;
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function wrap(d){while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
  function overviewRadius(){return W/H<0.8?52:W/H<1.2?44:36;}
  function focus(id){
    var mobile=W<=820;
    if(!id){ goal.tx=0;goal.ty=1.5;goal.tz=0;goal.radius=overviewRadius();goal.phi=1.0;goal.off=0; ring.visible=false; return; }
    var it=groups.filter(function(x){return x.id===id;})[0];
    goal.tx=it.group.position.x; goal.ty=it.top*0.38; goal.tz=it.group.position.z;
    goal.theta=view.theta+wrap(it.a-view.theta); goal.phi=1.12; goal.radius=mobile?19:15;
    goal.off=mobile?H*0.17:0;
    ring.position.x=it.group.position.x; ring.position.z=it.group.position.z; ring.material.color.copy(it.color); ring.visible=true;
  }
  api={focus:focus,setAuto:function(v){auto=v;}};

  function resize(){
    var r=stageEl.getBoundingClientRect(); W=Math.max(1,r.width);H=Math.max(1,r.height);
    renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix();
    if(!current) goal.radius=overviewRadius();
  }
  if(window.ResizeObserver) new ResizeObserver(resize).observe(stageEl); else window.addEventListener("resize",resize);
  resize();

  /* theme sync */
  function themeSync(){
    var cs=getComputedStyle(document.documentElement), gc=cs.getPropertyValue("--ground").trim(), pc=cs.getPropertyValue("--path").trim(), sb=cs.getPropertyValue("--sky-bot").trim();
    if(gc) groundMat.color.set(gc); if(pc) pathMat.color.set(pc); if(sb) scene.fog.color.set(sb);
    var th=document.documentElement.getAttribute("data-theme");
    var dark= th==="dark" || (th!=="light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    hemi.intensity=dark?0.45:0.85; sun.intensity=dark?0.55:0.9; hemi.groundColor.set(dark?0x1c2a28:0x9aa89a);
  }
  themeSync();
  if(window.matchMedia) try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",themeSync);}catch(e){}
  new MutationObserver(themeSync).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

  /* input */
  var ptrs=new Map(), moved=0, pinch0=0, ray=new T.Raycaster(), ndc=new T.Vector2(), hovered=null;
  function dist(){var a=Array.from(ptrs.values());return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
  function idAt(cx,cy){
    var r=glEl.getBoundingClientRect(); ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera); var h=ray.intersectObjects(pickables,false);
    if(!h.length) return null; var o=h[0].object; while(o&&!o.userData.id) o=o.parent; return o?o.userData.id:null;
  }
  glEl.addEventListener("pointerdown",function(e){
    try{glEl.setPointerCapture(e.pointerId);}catch(x){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(ptrs.size===1) moved=0; if(ptrs.size===2) pinch0=dist();
    interacting=true; glEl.classList.add("dragging");
  });
  glEl.addEventListener("pointermove",function(e){
    var p=ptrs.get(e.pointerId);
    if(!p){ if(e.pointerType==="mouse"){hovered=idAt(e.clientX,e.clientY);glEl.style.cursor=hovered?"pointer":"";} return; }
    var dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX;p.y=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    if(ptrs.size===1){goal.theta-=dx*0.006;goal.phi=clamp(goal.phi-dy*0.005,0.28,1.45);}
    else if(ptrs.size===2){var d=dist(); if(pinch0) goal.radius=clamp(goal.radius*pinch0/d,MINR,MAXR); pinch0=d;}
  });
  function up(e){
    if(!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if(ptrs.size===0){
      interacting=false; glEl.classList.remove("dragging");
      if(moved<6&&e.type==="pointerup"){var id=idAt(e.clientX,e.clientY); if(id) select(id);}
    }
  }
  glEl.addEventListener("pointerup",up); glEl.addEventListener("pointercancel",up);
  glEl.addEventListener("wheel",function(e){e.preventDefault();goal.radius=clamp(goal.radius*Math.exp(e.deltaY*0.0012),MINR,MAXR);},{passive:false});

  /* loop */
  var last=performance.now(), clock=0, v3=new T.Vector3(), running=true;
  document.addEventListener("visibilitychange",function(){running=!document.hidden; if(running){last=performance.now();requestAnimationFrame(frame);}});
  function frame(now){
    if(!running) return;
    var dt=Math.min(0.05,(now-last)/1000); last=now; clock+=dt;
    if(auto&&!interacting&&!current&&!reduced) goal.theta+=dt*0.1;
    var k=reduced?1:1-Math.exp(-dt*5.5);
    view.theta+=(goal.theta-view.theta)*k; view.phi+=(goal.phi-view.phi)*k; view.radius+=(goal.radius-view.radius)*k;
    view.tx+=(goal.tx-view.tx)*k; view.ty+=(goal.ty-view.ty)*k; view.tz+=(goal.tz-view.tz)*k; view.off+=(goal.off-view.off)*k;
    var sp=Math.sin(view.phi);
    camera.position.set(view.tx+view.radius*sp*Math.sin(view.theta),view.ty+view.radius*Math.cos(view.phi),view.tz+view.radius*sp*Math.cos(view.theta));
    camera.lookAt(view.tx,view.ty,view.tz);
    if(Math.abs(view.off)>0.5) camera.setViewOffset(W,H,0,view.off,W,H); else camera.clearViewOffset();
    camera.updateMatrixWorld(); camera.updateProjectionMatrix();
    if(!reduced) anims.forEach(function(f){f(clock);});
    groups.forEach(function(it){
      var want=(hovered===it.id||current===it.id)?1.045:1; it.s+=(want-it.s)*0.18; it.group.scale.setScalar(it.s);
      if(it.label){
        v3.set(it.group.position.x,it.top+0.9,it.group.position.z).project(camera);
        var vis=v3.z<1&&Math.abs(v3.x)<1.2&&Math.abs(v3.y)<1.2;
        it.label.style.display=vis?"":"none";
        if(vis) it.label.style.transform="translate("+((v3.x*0.5+0.5)*W)+"px,"+((-v3.y*0.5+0.5)*H)+"px) translate(-50%,-100%)";
        it.label.classList.toggle("on",current===it.id); it.label.classList.toggle("hov",hovered===it.id);
      }
    });
    v3.set(0,hubTop,0).project(camera);
    var hv=v3.z<1&&(!current)&&Math.abs(v3.x)<1.2&&Math.abs(v3.y)<1.2; hubLabel.style.display=hv?"":"none";
    if(hv) hubLabel.style.transform="translate("+((v3.x*0.5+0.5)*W)+"px,"+((-v3.y*0.5+0.5)*H)+"px) translate(-50%,-100%)";
    if(ring.visible){var s=1+Math.sin(clock*3)*0.04; ring.scale.set(s,s,s); ring.material.opacity=0.65+Math.sin(clock*3)*0.3;}
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
renderPanel();
try{ init3D(); }
catch(err){ api=null; $("#nogl").style.display="flex"; if(window.console) console.warn("3D init failed",err); }
var h0=location.hash.slice(1); select(h0&&BYID[h0]?h0:null,true);
if(api&&!current) api.focus(null);
})();
</script>
